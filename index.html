<!doctype html>
<html lang="zh" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta
      name="description"
      content="Tyoke Dimn — 常驻广东的创意摄影师与摄像师。在时间的裂缝中捕捉最强烈的瞬间。"
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/mestain.ttf" as="font" type="font/ttf" crossorigin />
    <!-- 摄像页第一张海报预览：页面加载即预取，首次悬停秒显（其余两张随 DOM 常驻 img 预载） -->
    <link rel="preload" as="image" href="/assets/videos/preview1.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 非阻塞加载外部字体样式：不阻塞首屏渲染（字体加载完成后再应用，系统字体先行显现） -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Instrument+Serif:ital@0;1&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>TyokeDimn | 作品集</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
